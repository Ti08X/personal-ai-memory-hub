name: personal-memory-hub
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: personal-memory-hub:server-v1
    restart: unless-stopped
    network_mode: host
    env_file: /etc/personal-memory-hub/runtime.env
    environment:
      DATABASE_PATH: /data/memory.sqlite
      PUBLIC_ORIGIN: https://pw.zgatri.com
      QDRANT_URL: http://127.0.0.1:6333
    volumes:
      - /var/lib/personal-memory-hub/data:/data
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8830/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: personal-memory-hub:server-v1
    restart: unless-stopped
    network_mode: host
    env_file: /etc/personal-memory-hub/runtime.env
    environment:
      DATABASE_PATH: /data/memory.sqlite
      QDRANT_URL: http://127.0.0.1:6333
      WORKER_POLL_MS: '10000'
    command: [node, server/worker.mjs]
    stop_grace_period: 180s
    volumes:
      - /var/lib/personal-memory-hub/data:/data
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  vectors:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports: ['127.0.0.1:6333:6333']
    env_file: /etc/personal-memory-hub/vector.env
    volumes:
      - /var/lib/personal-memory-hub/vectors:/qdrant/storage
      - /var/lib/personal-memory-hub/vector-snapshots:/qdrant/snapshots
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
