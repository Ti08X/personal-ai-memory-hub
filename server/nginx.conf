# Installed as a separate 1Panel/OpenResty virtual host. Existing sites untouched.
server {
    listen 80;
    listen [::]:80;
    server_name pw.zgatri.com;
    access_log off;
    return 308 https://pw.zgatri.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pw.zgatri.com;
    ssl_certificate /www/sites/pw.zgatri.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/pw.zgatri.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PMHSSL:1m;
    ssl_session_timeout 1d;
    access_log off;
    error_log /var/log/nginx/personal-memory-hub-error.log crit;
    include /www/sites/pw.zgatri.com/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:8830;
        proxy_http_version 1.1;
        proxy_set_header Host pw.zgatri.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
